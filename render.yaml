services:
  - type: web
    name: sacolicia-carioca
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn run:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_CLIENT_EMAIL
        sync: false
      - key: DEMO_CLIENT_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
